# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render dashboard → New → Blueprint → pick this repo.
#
# Native Node runtime (no Docker). The free plan has no persistent disk, so the
# SQLite DB resets on every deploy / restart; SEED_DEMO=true recreates the demo
# account on each boot, which is fine for a portfolio. To keep real data,
# upgrade to Starter, uncomment the `disk` block and set
# DATABASE_URL=file:/var/data/dev.db.
services:
  - type: web
    name: jobsync
    runtime: node
    plan: free
    buildCommand: npm run deploy:build
    startCommand: npm run deploy:start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        value: file:./dev.db
      - key: AUTH_TRUST_HOST
        value: "true"
      # NEXTAUTH_URL is optional: start.mjs falls back to RENDER_EXTERNAL_URL.
      - key: AUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: TZ
        value: Asia/Karachi
    # disk:
    #   name: jobsync-data
    #   mountPath: /var/data
    #   sizeGB: 1
