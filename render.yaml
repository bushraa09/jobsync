# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render dashboard → New → Blueprint → pick this repo.
#
# Free plan has no persistent disk, so the SQLite DB resets on every deploy /
# restart. SEED_DEMO=true recreates the demo account on each boot, which is
# fine for a portfolio. To keep real data, upgrade to Starter and uncomment
# the `disk` block below.
services:
  - type: web
    name: jobsync
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3737"
      - key: DATABASE_URL
        value: file:/data/dev.db
      - key: AUTH_TRUST_HOST
        value: "true"
      # NEXTAUTH_URL is optional: the entrypoint falls back to Render's
      # RENDER_EXTERNAL_URL. Set it only if you use a custom domain.
      - key: AUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: TZ
        value: Asia/Karachi
    # disk:
    #   name: jobsync-data
    #   mountPath: /data
    #   sizeGB: 1
